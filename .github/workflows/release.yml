name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # The signing secrets live on this environment so publishing a tag waits for
    # a human. A release is irreversible for users: `brew upgrade` replaces the
    # app, and a rotated identity silently revokes their Accessibility grant.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Resources/Info.plist is the only place the version lives, so a tag that
      # disagrees with it would publish a mislabelled build.
      - name: Verify tag matches bundle version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plist_version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          if [ "$tag_version" != "$plist_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist_version"
            exit 1
          fi

      # CHANGELOG.md is the only release-notes source, so a tag without a
      # valid entry would publish a release nobody can read. flatlog also
      # rejects an unreleased block, so the placeholder must be promoted with
      # `flatlog release` before tagging.
      - name: Validate CHANGELOG for the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          npx --yes @nilambar/flatlog@2 validate "$tag_version"

      - name: Run unit tests
        run: make test

      # The release path never falls back to ad-hoc signing: a new CDHash on
      # every update makes macOS re-ask for Accessibility, which users read as
      # a permissions bug. Missing identity, missing keychain secrets and a
      # signing failure are all hard errors.
      - name: Import signing identity
        env:
          HEYCAST_P12: ${{ secrets.HEYCAST_P12 }}
          HEYCAST_P12_PASSWORD: ${{ secrets.HEYCAST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./scripts/ci-import-identity.sh

      # --release signs with "Heycast" or fails, and compares the designated
      # requirement with Resources/release-identity.txt.
      - name: Build release artifacts
        run: make bundle-release

      - name: Verify signing identity and designated requirement
        run: |
          set -euo pipefail
          app=dist/Heycast.app
          expected="$(tr -d '\n' < Resources/release-identity.txt)"
          actual="$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')"
          echo "designated requirement: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::designated requirement changed; Accessibility grants will reset"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          # Authority lines only appear at -dvv. Capture first: grep -q exiting
          # early would SIGPIPE codesign and trip pipefail.
          details="$(codesign -dvv "$app" 2>&1)"
          if ! grep -qx 'Authority=Heycast' <<<"$details"; then
            echo "::error::$app is not signed by the Heycast identity"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_name="$(plutil -extract CFBundleName raw -o - Resources/Info.plist)"
          gh release create "$GITHUB_REF_NAME" \
            dist/Heycast-macos-arm64.zip \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "$app_name $GITHUB_REF_NAME. Release notes: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
